name: CI Secret Check

on:
  push: {}
  pull_request: {}

jobs:
  check-secrets:
    name: Check required CI secrets
    runs-on: ubuntu-latest
    steps:
      - name: Skip forked pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Pull request from fork detected; skipping secret check."

      - name: Check required secrets
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          missing=""
          required=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE)
          for s in "${required[@]}"; do
            val="${!s:-}"
            if [ -z "$val" ]; then
              echo "::error ::Missing secret $s"
              missing="$missing $s"
            else
              echo "$s: OK"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
